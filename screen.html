<style>
/* =====================================================================
   대형화면 v5 — "키워드 월" (이미지 시안 B 페스티벌 포스터 + 보완)
   목적: 지나가는 관람객이 3~5초 안에 '내 생활과 닿는 법' 하나를 보게 한다.
   - 오프닝: 법안 키워드 타일 6장이 몇 초마다 다른 법으로 바뀜(한 바퀴에 18개 모두 노출)
   - 글꼴: 모두 Pretendard. 제목·키워드는 굵게(860), 설명은 보통 굵기 (10/29 가석원 → Pretendard, 가독성)
   - 색: 블루가 가장 넓게. 한 장면에 블루 + 보조색 두 계열까지
         (오프닝: 하늘·퍼플 / 개혁과 제도: 하늘 / 성장과 산업: 퍼플·라벤더 / 민생과 복지: 그린·민트)
   - 다른 정당을 떠올리게 하는 빨강·주황·노랑 없음. 로고는 흰 바탕에 파란 로고만(BS09)
   콘텐츠(DATA)는 v1 src/sign_template.html 것을 build_v2.py가 그대로 넣음.
   ===================================================================== */
:root{
  color-scheme:light;
  --blue:#003B95; --sky:#A9CBFF; --skyl:#DCE8FF;
  --purple:#5B1C87; --lav:#D9C9F0;
  --green:#006464; --mint:#A6E8DA;
  --ink:#0E1B3A; --navy:#0B1633; --mute:#5C6880; --paper:#F5F7FB; --line:#DDE3EE;
  --disp:"Pretendard Variable",Pretendard,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0f1e}
body{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;cursor:none}
em{font-style:normal}
.disp{font-family:var(--disp);font-weight:860;letter-spacing:-.045em}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;flex:none;transform-origin:center center;background:#fff}

.scene{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s .5s;background:#fff}
.scene.active{opacity:1;visibility:visible;transition:opacity .5s ease}

/* 등장 */
.rv{opacity:0}
.scene.active .rv{animation:rise .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0) * 1s)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.scene.active .pop{animation-name:pop}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
body.still .rv{animation:none!important;opacity:1!important;transform:none!important}
body.still .st,body.st .open,body.still .st .open,body.still .st .v{transition:none!important}

/* ---------- 1 오프닝: 키워드 월 ---------- */
.s-open .logo{position:absolute;left:100px;top:80px;width:190px}
.s-open .y{position:absolute;left:100px;top:246px;font-size:64px;color:var(--ink);letter-spacing:-.02em}
.s-open .h{position:absolute;left:92px;top:326px;font-size:164px;line-height:1;color:var(--blue);white-space:nowrap}
/* 부제: 아래 타일 모자이크가 위로 한 칸 자라 올라온 블루 타일 (10/29) */
/* 11/02 부제: 타일과 같은 블루 사각형이라 묻혀 보임 → 타일에서 띄운 둥근 블루→퍼플 그라데이션 카드(타일은 모두 단색) */
.s-open .s{position:absolute;right:64px;top:64px;width:600px;height:432px;border-radius:32px;background:linear-gradient(135deg,#2F6BFF 0%,#5B4BE0 55%,#7B3FC9 100%);box-shadow:0 34px 60px -28px rgba(91,75,224,.6);color:#fff;padding:0 52px 50px;display:flex;flex-direction:column;justify-content:flex-end}
.s-open .s small{font-size:40px;font-weight:860;color:#E6DEFF;margin-bottom:22px;line-height:1.2;letter-spacing:-.04em}
.s-open .s small:before{content:"";display:block;width:64px;height:8px;border-radius:4px;background:#fff;margin-bottom:30px}
.s-open .s b{font-size:62px;font-weight:860;line-height:1.16;letter-spacing:-.045em}
.wall{position:absolute;left:0;right:0;bottom:0;height:520px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:1fr 1fr}
.tile{position:relative;overflow:hidden}
.tile .kw{position:absolute;left:36px;right:36px;bottom:34px;transition:transform .55s cubic-bezier(.65,0,.25,1),opacity .4s}
.tile .kw small{display:block;font-family:"Pretendard Variable";font-size:22px;font-weight:700;margin-bottom:12px;opacity:.78}
.tile .kw b{display:block;font-family:var(--disp);font-weight:860;font-size:60px;line-height:1.14;letter-spacing:-.04em}
.tile .kw.out{transform:translateY(-120%);opacity:0}
.tile .kw.in{transform:translateY(120%);opacity:0}
.w1{grid-column:span 4;background:var(--blue);color:#fff}
.w2{grid-column:span 3;background:var(--sky);color:var(--blue)}
.w3{grid-column:span 5;background:var(--purple);color:#fff}
.w4{grid-column:span 3;background:var(--skyl);color:var(--blue)}
.w5{grid-column:span 5;background:var(--blue);color:var(--sky)}
.w6{grid-column:span 4;background:var(--sky);color:var(--blue)}

/* ---------- 2 검찰개혁 (블루 + 하늘) ---------- */
.s-hero{background:var(--navy);color:#fff}   /* 10/29 블루 → 짙은 남색: 오프닝·분야 장면과 톤을 끊어 장면 전환이 보이게 */
.s-hero .k{position:absolute;left:100px;top:110px;font-size:32px;font-weight:800;color:var(--sky)}
.s-hero .q{position:absolute;left:94px;top:176px;font-size:132px;line-height:1.12}
.s-hero .q .l1{color:var(--sky)}
.s-hero .law{position:absolute;left:100px;top:520px;font-size:25px;font-weight:500;color:rgba(255,255,255,.7)}
.facts{position:absolute;left:0;right:0;bottom:0;height:400px;display:grid;grid-template-columns:repeat(3,1fr)}
.fact{padding:56px 60px;display:flex;flex-direction:column;justify-content:flex-end}
.fact:nth-child(1){background:var(--blue);color:#fff}
.fact:nth-child(1) .d{color:rgba(255,255,255,.82)}
.fact:nth-child(2){background:var(--sky);color:var(--blue)}
.fact:nth-child(3){background:#fff;color:var(--blue)}
.fact .h{font-family:var(--disp);font-weight:860;font-size:56px;line-height:1.12;letter-spacing:-.04em}
.fact .d{margin-top:18px;font-size:27px;font-weight:600;color:var(--ink);line-height:1.45}

/* ---------- 3-5 분야: 색 패널 + 업데이트 목록 ---------- */
.s-cat{background:var(--paper)}
.s-cat .panel{position:absolute;left:0;top:0;bottom:0;width:700px;background:var(--pc);color:#fff;padding:84px 90px}
.s-cat .panel .run{font-size:24px;font-weight:600;opacity:.72}
.s-cat .panel .t{margin-top:150px;font-size:var(--tfs,164px);line-height:1.06;color:var(--tt);white-space:nowrap}   /* 11/02 긴 제목은 스크립트가 패널 폭에 맞춰 줄임 */
.s-cat .panel .d{margin-top:46px;font-size:32px;font-weight:500;line-height:1.55}
.s-cat .list{position:absolute;left:800px;right:100px;top:84px;bottom:84px;display:flex;flex-direction:column;justify-content:space-between}
.s-cat .r{display:grid;grid-template-columns:86px 1fr;align-items:center;padding-bottom:20px;border-bottom:2px solid var(--line)}
.s-cat .r i{width:58px;height:58px;border-radius:50%;background:var(--tint);color:var(--pc);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:38px;font-weight:700}
.s-cat .r b{display:block;font-size:41px;font-weight:800;letter-spacing:-.03em;line-height:1.22}
.s-cat .r b em{color:var(--em)}
.s-cat .r span{display:block;margin-top:6px;font-size:24px;font-weight:500;color:var(--mute)}

/* ---------- 6 생애주기: 펼쳐지는 타일 + 원 ---------- */
.s-life .k{position:absolute;left:100px;top:84px;font-size:62px;color:var(--blue)}
.bento{position:absolute;left:100px;right:100px;top:196px;bottom:84px;display:flex;gap:16px}
.st{flex:0 0 150px;border-radius:26px;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);transition:flex-basis .5s cubic-bezier(.65,0,.25,1),flex-grow .5s cubic-bezier(.65,0,.25,1),background .5s,color .5s,opacity .5s}
.st .v{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;transition:opacity .3s}
.st .v span{writing-mode:vertical-rl;font-family:var(--disp);font-weight:860;font-size:50px;letter-spacing:.02em}
.st.done{opacity:.5}
.st.on{flex:1 1 auto;background:var(--blue);color:#fff;opacity:1}
.st.on .v{opacity:0}
.st .open{position:absolute;inset:0;padding:50px 56px 44px;display:flex;flex-direction:column;opacity:0;pointer-events:none}
.st.on .open{opacity:1;transition:opacity .3s ease .3s}   /* 타일이 펼쳐지자마자 내용이 보이도록 */
.st .orb{position:absolute;right:-110px;top:-120px;width:440px;height:440px;border-radius:50%;background:var(--sky);opacity:.3}  /* 단계명이 길어도 흰 글자가 읽히도록 반투명 */
.st .name{position:relative;font-family:var(--disp);font-weight:860;font-size:160px;line-height:1;letter-spacing:-.05em;color:#fff}
.st .name.long{font-size:104px;line-height:1.05}   /* 7자 이상 단계명(예: 더불어 사는 이웃)은 한 줄에 맞춤 */
.st .num{position:relative;margin-top:16px;margin-bottom:18px;font-size:26px;font-weight:700;color:var(--sky)}
.st ul{list-style:none;margin-top:auto;position:relative}
.st li{padding:20px 0 18px;border-top:2px solid rgba(255,255,255,.25)}
.st li b{display:block;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.24}
.st li span{display:block;margin-top:6px;font-size:24px;font-weight:500;color:rgba(255,255,255,.72)}
.st ul.dense li{padding:10px 0 9px}
.st ul.dense li b{font-size:32px}
.st ul.dense li span{font-size:22px;margin-top:4px}
.st .pts{display:flex;flex-direction:column;gap:2px}
.st .pts p{position:relative;font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.24}
/* 11/02 17:17 점(머리 기호) 삭제 — 다른 항목엔 없어서 여기만 튐. 네 줄을 다른 항목 제목과 같은 왼쪽 선에 맞춤 */
.st ul.dense .pts p{font-size:29px}

/* ---------- 7 마무리: 슬로건 + QR + 키워드 띠 ---------- */
.s-close .logo{position:absolute;left:100px;top:80px;width:190px}
.s-close .slogan{position:absolute;left:94px;top:270px;width:1180px;font-size:116px;line-height:1.14;color:var(--ink)}
.s-close .slogan em{color:var(--blue)}
.s-close .slogan.ph{font-family:"Pretendard Variable";font-size:40px;color:var(--mute);border:3px dashed var(--line);padding:50px}
.qr{position:absolute;right:100px;top:150px;width:400px}
.qr .box{width:400px;height:400px;border:4px solid var(--blue);border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;padding:26px;font-size:30px;font-weight:700;color:var(--mute)}
.qr .box.ph{border-style:dashed;border-color:#B7C3DA;background:var(--paper)}
.qr .box img{width:100%;height:100%}
.qr .cap{margin-top:24px;font-size:32px;font-weight:800;line-height:1.3;letter-spacing:-.02em}
.qr .cap small{display:block;margin-top:8px;font-size:23px;font-weight:500;color:var(--mute)}
.ticker{position:absolute;left:0;right:0;bottom:0;height:170px;overflow:hidden}
.ticker .track{display:flex;height:100%;width:max-content;animation:tick 60s linear infinite}
.ticker .chip{display:flex;align-items:center;padding:0 54px;font-family:var(--disp);font-weight:860;font-size:48px;letter-spacing:-.04em;white-space:nowrap}
.ticker .c0{background:var(--blue);color:#fff}.ticker .c1{background:var(--sky);color:var(--blue)}.ticker .c2{background:var(--purple);color:#fff}
.ticker .c3{background:var(--skyl);color:var(--blue)}.ticker .c4{background:var(--green);color:#fff}.ticker .c5{background:var(--mint);color:var(--green)}
@keyframes tick{to{transform:translateX(-50%)}}
body.still .ticker .track{animation:none}

/* 진행 표시 */
#prog{position:absolute;right:100px;top:40px;display:flex;gap:8px;z-index:9}
#prog i{width:10px;height:10px;border-radius:50%;background:rgba(14,27,58,.16);transition:background .3s,width .3s}
#prog i.on{width:34px;border-radius:5px;background:var(--blue)}
#prog i.lf{width:8px;height:8px;margin-top:1px}#prog i.lf.on{width:28px;height:10px;margin-top:0}   /* 11/02 생애주기 단계 점은 조금 작게(묶음으로 보이게) */
#prog.ondark i{background:rgba(255,255,255,.35)}
#prog.ondark i.on{background:#fff}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;font:600 15px/1 "Pretendard Variable",sans-serif;padding:12px 18px;border-radius:999px;opacity:0;transition:opacity .4s;pointer-events:none;z-index:99}
#hint.show{opacity:1}
</style>

const SPEED = 1;
const LIFE_STEP = 3000;            // 생애주기 단계당 3초 (10/29 2.5초로 줄였다가 "너무 휙휙 지나감"으로 3초 복귀)
const OPEN_SWAP = 2500;            // 오프닝 키워드가 바뀌는 간격(밀리초) (10/29 최종 2.5초)
const plain = h => h.replace(/<br\s*\/?>/g,' ');
const S = [];

/* 1 오프닝 — 타일 6장 × 키워드 3개 = 18개를 한 바퀴에 모두 보여 줌 */
const ALL = HOOKS.flatMap((list,ti)=>list.map(k=>({k, cat:DATA.themes[ti].sub})));
const TILE_Q = [0,1,2,3,4,5].map(t=>[0,1,2].map(r=>ALL[(t*3 + r*7) % ALL.length]));   // 타일마다 다른 분야가 섞이도록
const kw = h => `<div class="kw"><small>${h.cat}</small><b>${h.k}</b></div>`;
// 오프닝 길이: 키워드 세 묶음이 같은 시간씩 보이도록 OPEN_SWAP × 3 (약 7초)
S.push({dur:OPEN_SWAP*3 + 200, open:true, html:`
<section class="scene s-open">
  <img class="logo rv" style="--d:.05" src="${LOGO_B}" alt="더불어민주당">
  <div class="y disp rv" style="--d:.15">2026</div>
  <div class="h disp rv" style="--d:.3">${DATA.open.main.replace(/<[^>]+>/g,'').replace(/^2026\s*/,'')}</div>
  <div class="s rv pop" style="--d:.45"><small>더불어민주당<br>2026년 중점추진법안</small><b>${DATA.open.sub.replace(' 입법',' <br>입법')}</b></div>
  <div class="wall">${TILE_Q.map((q,i)=>`<div class="tile w${i+1} rv pop" style="--d:${(.55+i*.08).toFixed(2)}">${kw(q[0])}</div>`).join('')}</div>
</section>`});

/* 2 검찰개혁 */
// 검찰개혁 (10/29 최종 6초)
S.push({dur:6000, dark:true, html:`
<section class="scene s-hero">
  <div class="k rv">${DATA.hero.kicker}</div>
  <div class="q disp rv" style="--d:.15">${DATA.hero.quote.split('<br>').map((l,i)=>`<span class="l${i}">${l}</span>`).join('<br>')}</div>
  <div class="law rv" style="--d:.4">${DATA.hero.foot}</div>
  <div class="facts">${DATA.hero.facts.map((f,i)=>`<div class="fact rv pop" style="--d:${(.7+i*.18).toFixed(2)}"><div class="h">${f.t}</div><div class="d">${f.d}</div></div>`).join('')}</div>
</section>`});

/* 3-5 분야 */
/* 분야 장면 순서: 개혁과 제도(블루) → 성장과 산업(퍼플) → 민생과 복지(그린)
   민생과 복지가 '내 삶이 이렇게 달라집니다' 바로 앞에 오도록 (10/29 사용자 결정). 숫자는 DATA.themes 의 순번 */
const THEME_ORDER = [0, 1, 2];
THEME_ORDER.filter(ti=>DATA.themes[ti]).forEach(ti=>{
  const th = DATA.themes[ti];
  const c = THEME_STYLE[ti % THEME_STYLE.length];
  // 분야 장면 각 (10/29 최종 7초)
  S.push({dur:7000, html:`
<section class="scene s-cat" style="--pc:${c.pc};--tt:${c.tt};--tint:${c.tint};--em:${c.em}">
  <div class="panel">
    <div class="run rv">${DATA.footLabel}</div>
    <div class="t disp rv" style="--d:.1">${th.sub.replace(' ','<br>')}</div>
    <div class="d rv" style="--d:.35">${th.desc}</div>
  </div>
  <div class="list">${th.cards.map((cd,i)=>`<div class="r rv" style="--d:${(.4+i*.16).toFixed(2)}"><i>+</i><div><b>${plain(cd.h)}</b><span>${cd.m}</span></div></div>`).join('')}</div>
</section>`});
});

/* 6 생애주기 */
S.push({dur:DATA.life.length*LIFE_STEP, life:true, html:`
<section class="scene s-life">
  <div class="k disp rv">내 삶이 이렇게 달라집니다</div>
  <div class="bento rv" style="--d:.15">${DATA.life.map((l,i)=>{ const [bg,fg] = LIFE_TINT[i % LIFE_TINT.length];
    return `<div class="st" style="--bg:${bg};--fg:${fg}"><div class="v"><span>${l.stage}</span></div>
      <div class="open"><div class="orb"></div><div class="name${l.stage.replace(/\s/g,'').length>5?' long':''}">${l.stage}</div><div class="num">${String(i+1).padStart(2,'0')} / ${String(DATA.life.length).padStart(2,'0')}</div>
      <ul class="${l.items.length>3?'dense':''}">${l.items.map(it=>`<li>${it.list ? `<div class="pts">${it.list.map(x=>`<p>${x}</p>`).join('')}</div>` : `<b>${it.t}</b>`}<span>${it.s}</span></li>`).join('')}</ul></div></div>`; }).join('')}</div>
</section>`});

/* 7 마무리 */
const chips = ALL.map((h,i)=>`<div class="chip c${i%6}">${h.k}</div>`).join('');
// 마무리 (10/29 최종 7초)
S.push({dur:7000, html:`
<section class="scene s-close">
  <img class="logo rv" style="--d:.05" src="${LOGO_B}" alt="더불어민주당">
  <div class="slogan disp rv ${DATA.slogan?'':'ph'}" style="--d:.2">${DATA.slogan || '슬로건 자리 (문구 확정 후 입력)'}</div>
  <div class="qr rv" style="--d:.5">
    <div class="box ${DATA.qrImage?'':'ph'}">${DATA.qrImage?`<img src="${DATA.qrImage}" alt="QR">`:'QR 코드 자리'}</div>
    <div class="cap">${DATA.qrCaption}<small>카메라로 QR을 비춰 주세요</small></div>
  </div>
  <div class="ticker"><div class="track">${chips}${chips}</div></div>
</section>`});

/* ===== 플레이어 (v1과 같은 조작) ===== */
const stage = document.getElementById('stage');
/* 11/02: 재생·이동 단위를 '장면'이 아니라 '단계(STEPS)'로. 생애주기는 단계마다 한 칸이라
   ←/→ 로 원하는 단계에 바로 가고, 진행 점도 단계마다 하나 (화면 구성은 그대로) */
const STEPS = [];
S.forEach((s,si)=>{ const n = s.life ? DATA.life.length : 1;
  for (let li=0; li<n; li++) STEPS.push({si, li, dur: s.life ? LIFE_STEP : s.dur}); });
stage.innerHTML = S.map(s=>s.html).join('') + `<div id="prog">${STEPS.map(st=>`<i${S[st.si].life?' class="lf"':''}></i>`).join('')}</div>`;
const scenes = [...stage.querySelectorAll('.scene')];
const prog = document.getElementById('prog');
const params = new URLSearchParams(location.search);
const STILL = params.has('still');
if (STILL) document.body.classList.add('still');
function fit(){ const k = Math.min(innerWidth/1920, innerHeight/1080); stage.style.transform = `scale(${k})`; }
addEventListener('resize', fit); fit();

let cur = -1, timer = null, openTimers = [], paused = false;

/* 오프닝 키워드 교체: 타일마다 0.12초씩 차례로 */
function swapTile(tile, h){
  const old = tile.querySelector('.kw'); const nw = document.createElement('div');
  nw.className = 'kw in'; nw.innerHTML = kw(h).replace(/^<div class="kw">|<\/div>$/g,'');
  tile.appendChild(nw); void nw.offsetWidth;
  old.classList.add('out'); nw.classList.remove('in');
  setTimeout(()=>old.remove(), 650);
}
function runOpen(sc){
  openTimers.forEach(clearTimeout); openTimers = [];
  const tiles = [...sc.querySelectorAll('.tile')];
  tiles.forEach((t,i)=>{ t.innerHTML = kw(TILE_Q[i][0]); });
  if (STILL) return;
  [1,2].forEach(r => tiles.forEach((t,i)=> openTimers.push(setTimeout(()=>swapTile(t, TILE_Q[i][r]), (r*OPEN_SWAP + i*120)/SPEED))));
}

function renderLife(sc, idx){
  sc.querySelectorAll('.st').forEach((s,i)=>{ s.classList.toggle('on', i===idx); s.classList.toggle('done', i<idx); });
}

function show(k, restart){
  k = (k + STEPS.length) % STEPS.length;
  clearTimeout(timer); openTimers.forEach(clearTimeout);
  const st = STEPS[k], s = S[st.si], sc = scenes[st.si];
  const same = !restart && cur >= 0 && STEPS[cur].si === st.si;   // 같은 장면 안 단계 이동이면 장면 등장 효과를 다시 틀지 않음
  if (!same){
    scenes.forEach((x,j)=>x.classList.toggle('active', j===st.si));
    sc.classList.remove('active'); void sc.offsetWidth; sc.classList.add('active');
    if (s.open) runOpen(sc);
  }
  cur = k;
  prog.classList.toggle('ondark', !!s.dark);
  [...prog.children].forEach((p,j)=>p.classList.toggle('on', j===k));
  if (s.life) renderLife(sc, st.li);
  if (!STILL && !paused) timer = setTimeout(()=>show(cur+1), st.dur / SPEED);
}
addEventListener('keydown', e=>{
  if (e.key==='ArrowRight'){ show(cur+1); }
  else if (e.key==='ArrowLeft'){ show(cur-1); }
  else if (e.key===' '){ e.preventDefault(); paused=!paused; if (paused){ clearTimeout(timer); openTimers.forEach(clearTimeout); } else show(cur, !S[STEPS[cur].si].life); }   // 생애주기는 멈춘 단계 그대로 이어서
  else if (e.key==='f'||e.key==='F'){ toggleFS(); }
  else return;
  flashHint();
});
function toggleFS(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
addEventListener('dblclick', toggleFS);
let hintT; function flashHint(){ const h=document.getElementById('hint'); h.classList.add('show'); document.body.style.cursor='default'; clearTimeout(hintT); hintT=setTimeout(()=>{h.classList.remove('show'); document.body.style.cursor='none';},2200); }
addEventListener('mousemove', flashHint);

document.fonts.ready.then(()=>{
  // 11/02: 긴 분야 제목을 패널 폭에 맞추되, 세 장면이 같은 크기가 되도록 가장 작은 값으로 통일
  const titles = [...document.querySelectorAll('.s-cat .panel .t')];
  let common = 164;
  titles.forEach(el=>{
    const max = el.parentElement.clientWidth - 180;                  // 패널 좌우 여백 90px씩
    let fs = 164; el.style.setProperty('--tfs', fs+'px');
    while (el.scrollWidth > max && fs > 80){ fs -= 4; el.style.setProperty('--tfs', fs+'px'); }
    common = Math.min(common, fs);
  });
  titles.forEach(el=>el.style.setProperty('--tfs', common+'px'));
  // ?s=장면번호(1~7) &life=생애주기 단계(0~5) — 예전 주소 그대로 동작
  const si = +(params.get('s')||1) - 1, li = +(params.get('life')||0);
  let k0 = STEPS.findIndex(x=>x.si===si && x.li===li); if (k0 < 0) k0 = Math.max(0, STEPS.findIndex(x=>x.si===si));
  show(k0);
});
</script>
