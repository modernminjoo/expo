@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1430; --fg:#EAF0FF; --muted:#9BA9C9; --line:#232D52; --soft:#18214A;
  --plus-bg:#1D2C64; --plus:#A9CBFF; --chip-on:#A9CBFF; --chip-on-fg:#0E1430; --em:#A9CBFF; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1430; --fg:#EAF0FF; --muted:#9BA9C9; --line:#232D52; --soft:#18214A;
  --plus-bg:#1D2C64; --plus:#A9CBFF; --chip-on:#A9CBFF; --chip-on-fg:#0E1430; --em:#A9CBFF; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* 머리말 */
.hero{padding-top:env(safe-area-inset-top,0px)}
.hero .wrap{padding-block:24px 22px}
.logo{display:block;height:32px;width:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
.y{margin:38px 0 0;font-family:var(--disp);font-weight:860;font-size:24px;letter-spacing:-.02em;color:var(--fg)}
.hero h1{margin:4px 0 0;font-family:var(--disp);font-weight:860;letter-spacing:-.05em;font-size:clamp(38px,11.4vw,68px);line-height:1.08;color:var(--em);white-space:nowrap}
/* 부제 블루 띠 — 대형화면 v5 오프닝의 블루 타일과 같은 역할 (10/29) */
.tag{background:var(--blue);color:#fff}
.tag .wrap{padding-block:20px 22px}
.tag small{display:block;font-size:13px;font-weight:700;color:var(--sky)}
.tag b{display:block;margin-top:4px;font-size:clamp(20px,6vw,26px);font-weight:860;letter-spacing:-.04em;line-height:1.25}

/* 검색·분야 */
.controls{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.controls .wrap{padding-block:14px 12px}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--soft);border:2px solid transparent;border-radius:14px;padding:12px 44px 12px 14px;outline:none}
.search input:focus{border-color:var(--chip-on)}
.search input::placeholder{color:var(--muted)}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:14px;font-weight:700;color:var(--fg);background:var(--soft);border:0;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.chip:focus-visible,.search input:focus-visible{outline:2px solid var(--chip-on);outline-offset:2px}

/* 목록 */
.list{padding-block:6px calc(56px + env(safe-area-inset-bottom,0px))}
/* 10/29: 왼쪽 + 아이콘 삭제 — 눌리는 버튼으로 오해할 수 있어서. 상임위 앞 짧은 블루 막대로 항목 시작을 표시 */
.bill{padding:20px 0 18px;border-bottom:1px solid var(--line)}
.com{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.com:before{content:"";width:16px;height:4px;border-radius:2px;background:var(--plus)}
.bill h3{margin:2px 0 8px;font-size:18.5px;line-height:1.38;font-weight:800;letter-spacing:-.025em}
.bill ul{margin:0;padding:0;list-style:none}
.bill li{position:relative;padding-left:12px;font-size:15px;margin-top:4px}
.bill li:before{content:"";position:absolute;left:0;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.bill li.sub{padding-left:22px;font-size:14px;color:var(--muted)}
.bill li.sub:before{display:none}
mark{background:#FFE58A;color:#0E1B3A;padding:0 1px;border-radius:3px}
.empty{padding:56px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const FIELDS = [
  ["전체", null],
  ["사법·검찰개혁", ["법사위"]],
  ["행정·자치·안전", ["행안위","운영위"]],
  ["경제·금융·산업", ["정무위","재경위","산중위"]],
  ["노동·환경·에너지", ["기환노위"]],
  ["복지·보건", ["복지위","성평등위"]],
  ["교육·과학·문화", ["교육위","과방위","문체위"]],
  ["주거·교통", ["국토위"]],
  ["농어촌·해양", ["농해수위"]],
  ["외교·안보", ["국방위","외통위"]]
];
/* ============================================================================ */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let state = { f:0, q:"" };
try { const s = JSON.parse(sessionStorage.getItem("bills-filter-v5")||"null"); if (s) state = { f:+s.f||0, q:String(s.q||"") }; } catch(e){}
if (!FIELDS[state.f]) state.f = 0;

$("chips").innerHTML = FIELDS.map(([n],i)=>`<button class="chip" type="button" data-f="${i}" aria-pressed="false">${n}</button>`).join("");
$("chips").addEventListener("click", e=>{ const t=e.target.closest(".chip"); if(!t) return; state.f=+t.dataset.f; render(); t.scrollIntoView({inline:"nearest",block:"nearest"}); });
$("q").value = state.q;
$("q").addEventListener("input", e=>{ state.q=e.target.value; render(); });
$("clear").addEventListener("click", ()=>{ state.q=""; $("q").value=""; $("q").focus(); render(); });

function hl(text, q){
  const t = esc(text); if (!q) return t;
  const k = esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return t.replace(new RegExp(k,"gi"), m=>`<mark>${m}</mark>`);
}
function render(){
  const q = state.q.trim().replace(/\s+/g," ");
  const coms = FIELDS[state.f][1];
  const hit = BILLS.filter(b => (!coms || coms.includes(b.c)) &&
    (!q || (b.t + " " + b.i.map(x=>x[1]).join(" ")).toLowerCase().includes(q.toLowerCase())));
  document.querySelectorAll(".chip").forEach(el=>el.setAttribute("aria-pressed", String(+el.dataset.f===state.f)));
  $("clear").hidden = !state.q;
  $("list").innerHTML = hit.length ? hit.map(b=>`<article class="bill"><div>
      <div class="com">${b.c}</div>
      <h3>${hl(b.t,q)}</h3>
      <ul>${b.i.map(([lv,tx])=>`<li${lv?' class="sub"':''}>${hl(tx,q)}</li>`).join("")}</ul>
    </div></article>`).join("")
    : `<div class="empty"><b>찾는 법안이 없어요</b>다른 단어로 검색하거나 ‘전체’를 눌러 주세요.</div>`;
  try { sessionStorage.setItem("bills-filter-v5", JSON.stringify(state)); } catch(e){}
}
render();
</script>
